name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --dir client typecheck
      - run: corepack pnpm --dir client lint
      - run: corepack pnpm --dir client test --run
      - run: corepack pnpm --dir client build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Generated client types are up to date
        run: |
          go run github.com/gzuidhof/tygo@v0.2.21 generate
          git diff --exit-code -- ../client/src/lib/api-types.gen.ts
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: server
